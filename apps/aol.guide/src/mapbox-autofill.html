<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapbox autofill sanity check</title>
    <style>
      :root {
        font-family: Segoe UI, system-ui, sans-serif;
        color: #0f172a;
      }
      body {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem 3rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      label {
        display: block;
        margin: 0.75rem 0 0.25rem;
        font-size: 0.85rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        height: 2.5rem;
        padding: 0 0.75rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.6rem;
      }
      #searchbox-host {
        min-height: 2.5rem;
      }
      .status {
        padding: 0.75rem 1rem;
        border-radius: 0.7rem;
        background: #f1f5f9;
        white-space: pre-wrap;
        font-size: 0.9rem;
      }
      .ok {
        background: #ecfdf5;
      }
      .fail {
        background: #fef2f2;
      }
      pre {
        overflow: auto;
        background: #0f172a;
        color: #e2e8f0;
        padding: 0.75rem 1rem;
        border-radius: 0.7rem;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <h1>Mapbox browser sanity check</h1>
    <p>
      Token is read in the browser from <code>AOL_GUIDE_MAPBOX_TOKEN</code> in
      <code>apps/aol.guide/.env.local</code>. Nothing is sent through the search API.
    </p>
    <div class="status" id="status">Loading…</div>

    <h2>Address Autofill</h2>
    <form id="address-form">
      <label for="address-line1">Address</label>
      <input
        id="address-line1"
        name="address"
        autocomplete="address-line1"
        placeholder="Start typing an Indian address"
      />
      <label for="address-level2">City</label>
      <input id="address-level2" name="city" autocomplete="address-level2" />
      <label for="postal-code">PIN</label>
      <input id="postal-code" name="postcode" autocomplete="postal-code" />
    </form>

    <h2>Search Box</h2>
    <div id="searchbox-host"></div>

    <h2>Last retrieve</h2>
    <pre id="result">(type and pick a suggestion)</pre>

    <script type="module" src="/mapbox-autofill.ts"></script>
  </body>
</html>
