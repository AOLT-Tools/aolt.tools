<!doctype html>
<html lang="en" class="bg-white">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Find Art of Living courses, ashram programs, and Vaidic pujas near you."
    />
    <title>AOL Guide</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="stylesheet" href="/main.css" />
  </head>
  <body
    class="min-h-dvh bg-white text-slate-900 antialiased"
    style="padding-bottom: env(safe-area-inset-bottom)"
  >
    <header
      class="sticky top-0 z-30 border-b border-slate-100 bg-white/95 backdrop-blur-xl"
    >
      <div
        class="mx-auto flex min-h-14 w-full max-w-[430px] items-center gap-2.5 px-4"
        style="padding-top: env(safe-area-inset-top)"
      >
        <img
          src="/icon.png"
          alt=""
          width="40"
          height="40"
          class="h-10 w-10 rounded-xl bg-white object-cover"
        />
        <h1 class="text-[17px] leading-none font-extrabold tracking-tight">
          <span class="text-[#1b3a6e]">AOL</span>
          <span class="text-[#ee6b1f]"> Guide</span>
        </h1>
        <span class="sync-pill ml-auto" id="status-pill" hidden></span>
      </div>
    </header>

    <main class="mx-auto w-full max-w-[430px] px-4 pb-10">
      <section class="pt-4" aria-label="Search">
        <form id="search-form" role="search">
          <label for="query" class="sr-only">Search programs near you</label>
          <div class="relative">
            <span
              class="pointer-events-none absolute top-1/2 left-3.5 z-10 -translate-y-1/2 text-slate-400"
              aria-hidden="true"
            >
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
            </span>

            <input
              id="query"
              name="query"
              type="search"
              autocomplete="off"
              enterkeyhint="search"
              placeholder="HP near 560045"
              aria-controls="search-suggestions"
              aria-expanded="false"
              required
              class="h-12 w-full rounded-2xl border border-slate-200 bg-slate-50 pr-14 pl-11 text-base text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-[#1b3a6e]/40 focus:bg-white focus:ring-4 focus:ring-[#1b3a6e]/10"
            />

            <button
              type="submit"
              aria-label="Search"
              class="absolute top-1/2 right-1 z-10 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-xl bg-[#ee6b1f] text-white transition active:scale-95"
            >
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14"></path>
                <path d="m14 7 5 5-5 5"></path>
              </svg>
            </button>

            <div
              class="suggestions"
              id="search-suggestions"
              role="listbox"
              hidden
            ></div>
          </div>
        </form>

        <div
          class="example-links -mx-1 mt-3 flex gap-2 overflow-x-auto px-1 pb-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
          aria-label="Quick searches"
        >
          <a class="search-chip" href="#" data-query="HP near 560045 within 10km"
            >Nearby</a
          >
          <a class="search-chip" href="#" data-query="HP 560045 Hindi this weekend"
            >Weekend</a
          >
          <a class="search-chip" href="#" data-query="AMP Bangalore Ashram next weekend"
            >Ashram</a
          >
          <a class="search-chip" href="#" data-query="Rudra Puja this weekend">Puja</a>
          <a class="search-chip" href="#" data-query="Intuition near 560001"
            >Intuition</a
          >
          <a class="search-chip" href="#" data-query="HP online">Online</a>
        </div>
      </section>

      <section class="summary-strip" id="summary-strip" hidden></section>

      <section class="mt-4" aria-live="polite">
        <div class="grid gap-2.5" id="results"></div>
      </section>
    </main>

    <script type="module" src="/search.ts"></script>
  </body>
</html>
