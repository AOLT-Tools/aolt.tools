<!doctype html>
<html lang="en" class="bg-white">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Find Art of Living courses, ashram programs, and Vaidic pujas near you."
    />
    <title>AOL Guide</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="stylesheet" href="/main.css" />
  </head>
  <body
    class="min-h-dvh bg-white text-slate-900 antialiased"
    style="padding-bottom: env(safe-area-inset-bottom)"
  >
    <header
      class="sticky top-0 z-30 border-b border-slate-100 bg-white/95 backdrop-blur-xl"
    >
      <div
        class="mx-auto flex min-h-14 w-full max-w-[430px] items-center gap-2.5 px-4"
        style="padding-top: env(safe-area-inset-top)"
      >
        <img
          src="/icon.png"
          alt=""
          width="40"
          height="40"
          class="h-10 w-10 rounded-xl bg-white object-cover"
        />
        <h1 class="text-[17px] leading-none font-extrabold tracking-tight">
          <span class="text-[#1b3a6e]">AOL</span>
          <span class="text-[#ee6b1f]"> Guide</span>
        </h1>
        <div class="ml-auto flex items-center gap-2">
          <span class="sync-pill" id="status-pill" hidden></span>
          <a
            class="feedback-link"
            href="mailto:jsaurabh@gmail.com?subject=AOL%20Guide%20feedback"
            aria-label="Send feedback by email"
          >
            💡 Feedback
          </a>
        </div>
      </div>
    </header>

    <main class="mx-auto w-full max-w-[430px] px-4 pb-10">
      <section class="pt-4" aria-label="Search">
        <div class="filter-bar">
          <div
            class="source-toggle"
            id="search-source"
            role="radiogroup"
            aria-label="Search catalogue"
          >
            <button
              type="button"
              class="source-option"
              role="radio"
              aria-checked="true"
              data-source="aol"
            >
              Courses
            </button>
            <button
              type="button"
              class="source-option"
              role="radio"
              aria-checked="false"
              data-source="center"
            >
              Center
            </button>
          </div>

          <div
            class="mode-toggle"
            id="search-mode"
            role="radiogroup"
            aria-label="Course mode"
          >
            <button
              type="button"
              class="mode-option"
              role="radio"
              aria-checked="true"
              data-mode="in_person"
            >
              In-person
            </button>
            <button
              type="button"
              class="mode-option"
              role="radio"
              aria-checked="false"
              data-mode="online"
            >
              Online
            </button>
          </div>
        </div>

        <div class="search-controls" id="search-controls">

          <div class="filter-slot" id="filter-slot">
            <div class="filter-control" id="location-control">
              <span class="filter-icon" aria-hidden="true">📍</span>
              <div class="filter-control-body" id="location-host">
                <div class="location-input-row">
                  <input
                    id="location-input"
                    class="filter-input"
                    type="search"
                    autocomplete="off"
                    enterkeyhint="search"
                    placeholder="Pick a location"
                    disabled
                  />
                  <button
                    type="button"
                    class="location-clear"
                    id="location-clear"
                    hidden
                    aria-label="Clear location"
                  >
                    ×
                  </button>
                </div>
                <div
                  class="suggestions"
                  id="location-suggestions"
                  hidden
                  role="listbox"
                  aria-label="Location suggestions"
                ></div>
              </div>
            </div>
          </div>

          <div class="time-control" id="time-control" hidden>
            <button
              type="button"
              class="filter-control time-range-control"
              id="time-range-control"
              aria-expanded="false"
              aria-controls="time-custom-panel"
            >
              <span class="filter-icon" aria-hidden="true">📅</span>
              <span class="time-range-label" id="time-range-label">Anytime</span>
            </button>
            <label class="sr-only" for="time-shortcut">Date shortcuts</label>
            <select id="time-shortcut" class="time-shortcut">
              <option value="" disabled>Range</option>
              <option value="anytime">Anytime</option>
              <option value="today">Today</option>
              <option value="tomorrow">Tomorrow</option>
              <option value="this_weekend">Weekend</option>
              <option value="next_7_days">7 days</option>
              <option value="custom">Custom</option>
            </select>
          </div>
        </div>

        <div class="time-custom-panel" id="time-custom-panel" hidden>
          <label class="time-custom-field" for="date-from">
            <span>From</span>
            <input id="date-from" class="date-input" type="date" />
          </label>
          <span class="date-sep" aria-hidden="true">–</span>
          <label class="time-custom-field" for="date-to">
            <span>To</span>
            <input id="date-to" class="date-input" type="date" />
          </label>
        </div>

        <div
          class="category-chips"
          id="category-chips"
          hidden
          role="radiogroup"
          aria-label="Program category"
        ></div>
      </section>

      <section class="summary-strip" id="summary-strip" hidden></section>

      <section class="mt-4" aria-live="polite">
        <div class="grid gap-2.5" id="results"></div>
      </section>
    </main>

    <script type="module" src="/search.ts"></script>
  </body>
</html>
