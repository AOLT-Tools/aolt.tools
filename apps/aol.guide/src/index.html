<!doctype html>
<html lang="en" class="bg-white">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Find Art of Living courses, ashram programs, and Vaidic pujas near you."
    />
    <title>AOL Guide</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="stylesheet" href="/main.css" />
  </head>
  <body
    class="min-h-dvh bg-white text-slate-900 antialiased"
    style="padding-bottom: env(safe-area-inset-bottom)"
  >
    <header
      class="sticky top-0 z-30 border-b border-slate-100 bg-white/95 backdrop-blur-xl"
    >
      <div
        class="mx-auto flex min-h-14 w-full max-w-[430px] items-center gap-2.5 px-4"
        style="padding-top: env(safe-area-inset-top)"
      >
        <img
          src="/icon.png"
          alt=""
          width="40"
          height="40"
          class="h-10 w-10 rounded-xl bg-white object-cover"
        />
        <h1 class="text-[17px] leading-none font-extrabold tracking-tight">
          <span class="text-[#1b3a6e]">AOL</span>
          <span class="text-[#ee6b1f]"> Guide</span>
        </h1>
        <div class="ml-auto flex items-center gap-2">
          <span class="sync-pill" id="status-pill" hidden></span>
          <a
            class="feedback-link"
            href="https://wa.me/919845702929?text=Hi%2C%20I%20have%20feedback%20for%20AOL%20Guide%3A"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Send feedback on WhatsApp"
          >
            💡 Feedback
          </a>
        </div>
      </div>
    </header>

    <main class="mx-auto w-full max-w-[430px] px-4 pb-10">
      <section class="pt-4" aria-label="Search">
        <div class="filter-bar">
          <div
            class="source-toggle"
            id="search-source"
            role="radiogroup"
            aria-label="Search catalogue"
          >
            <button
              type="button"
              class="source-option"
              role="radio"
              aria-checked="true"
              data-source="aol"
            >
              Courses
            </button>
            <button
              type="button"
              class="source-option"
              role="radio"
              aria-checked="false"
              data-source="vvmvp"
            >
              Ashram
            </button>
            <button
              type="button"
              class="source-option"
              role="radio"
              aria-checked="false"
              data-source="vds"
            >
              Puja
            </button>
          </div>

          <div
            class="mode-toggle"
            id="search-mode"
            role="radiogroup"
            aria-label="Course mode"
          >
            <button
              type="button"
              class="mode-option"
              role="radio"
              aria-checked="true"
              data-mode="in_person"
            >
              In-person
            </button>
            <button
              type="button"
              class="mode-option"
              role="radio"
              aria-checked="false"
              data-mode="online"
            >
              Online
            </button>
          </div>
        </div>

        <div class="filter-slot mt-1.5" id="filter-slot">
          <div class="filter-control" id="location-control">
            <span class="filter-icon" aria-hidden="true">📍</span>
            <div class="filter-control-body" id="location-host">
              <input
                id="location-fallback"
                class="filter-input"
                type="text"
                autocomplete="off"
                placeholder="Pick a location"
                disabled
              />
            </div>
          </div>

          <div class="filter-control" id="time-control" hidden>
            <span class="filter-icon" aria-hidden="true">🕐</span>
            <label for="time-preset" class="sr-only">Course dates</label>
            <select id="time-preset" class="filter-select">
              <option value="anytime">Anytime</option>
              <option value="today">Today</option>
              <option value="tomorrow">Tomorrow</option>
              <option value="this_weekend">This weekend</option>
              <option value="next_7_days">Next 7 days</option>
            </select>
          </div>
        </div>

        <div
          class="category-chips"
          id="category-chips"
          hidden
          aria-label="Course category"
        ></div>
      </section>

      <section class="summary-strip" id="summary-strip" hidden></section>

      <section class="mt-4" aria-live="polite">
        <div class="grid gap-2.5" id="results"></div>
      </section>
    </main>

    <script type="module" src="/search.ts"></script>
  </body>
</html>
