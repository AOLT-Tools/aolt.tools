<!doctype html>
<html lang="en" class="bg-white">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Find Art of Living courses and center Follow-up or Satsang near you."
    />
    <title>AOL Guide</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="stylesheet" href="/main.css" />
  </head>
  <body
    class="min-h-dvh bg-white text-slate-900 antialiased"
  >
    <header
      class="sticky top-0 z-30 border-b border-slate-100 bg-white/95 backdrop-blur-xl"
    >
      <div
        class="mx-auto flex min-h-14 w-full max-w-[430px] items-center gap-2.5 px-4"
        style="padding-top: env(safe-area-inset-top)"
      >
        <img
          src="/icon.png"
          alt=""
          width="40"
          height="40"
          class="h-10 w-10 rounded-xl bg-white object-cover"
        />
        <h1 class="text-[17px] leading-none font-extrabold tracking-tight">
          <span class="text-[#1b3a6e]">AOL</span>
          <span class="text-[#ee6b1f]"> Guide</span>
        </h1>
        <div class="ml-auto flex items-center gap-2">
          <span class="sync-pill" id="status-pill" hidden></span>
          <a
            class="feedback-link"
            href="mailto:jsaurabh@gmail.com?subject=AOL%20Guide%20feedback"
            aria-label="Send feedback by email"
          >
            💡 Feedback
          </a>
        </div>
      </div>
    </header>

    <main class="app-main mx-auto w-full max-w-[430px] px-4">
      <section
        class="tab-panel"
        id="tab-panel-search"
        role="tabpanel"
        aria-labelledby="tab-search"
        data-tab-panel="search"
        tabindex="0"
      >
      <section class="pt-4" aria-label="Search">
        <div class="filter-bar">
          <div
            class="source-toggle"
            id="search-source"
            role="radiogroup"
            aria-label="Search catalogue"
          >
            <button
              type="button"
              class="source-option"
              role="radio"
              aria-checked="true"
              data-source="aol"
            >
              Courses
            </button>
            <button
              type="button"
              class="source-option"
              role="radio"
              aria-checked="false"
              data-source="center"
            >
              Center
            </button>
          </div>

          <div
            class="mode-toggle"
            id="search-mode"
            role="radiogroup"
            aria-label="Course mode"
          >
            <button
              type="button"
              class="mode-option"
              role="radio"
              aria-checked="true"
              data-mode="in_person"
            >
              In-person
            </button>
            <button
              type="button"
              class="mode-option"
              role="radio"
              aria-checked="false"
              data-mode="online"
            >
              Online
            </button>
          </div>
        </div>

        <div class="search-controls" id="search-controls">

          <div class="filter-slot" id="filter-slot">
            <div class="filter-control" id="location-control">
              <span class="filter-icon" aria-hidden="true">📍</span>
              <div class="filter-control-body" id="location-host">
                <input
                  id="location-input"
                  class="filter-input"
                  type="search"
                  autocomplete="off"
                  enterkeyhint="search"
                  placeholder="Pick a location"
                  disabled
                />
                <div
                  class="suggestions"
                  id="location-suggestions"
                  hidden
                  role="listbox"
                  aria-label="Location suggestions"
                ></div>
              </div>
            </div>
          </div>

          <div class="program-control" id="program-control" hidden>
            <button
              type="button"
              class="filter-control compact-select-control"
              id="program-range-control"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="program-dialog"
            >
              <span class="filter-icon" aria-hidden="true">🧘</span>
              <span class="compact-select-label" id="program-range-label">Program</span>
            </button>
          </div>

          <div class="time-control" id="time-control" hidden>
            <button
              type="button"
              class="filter-control compact-select-control"
              id="time-range-control"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="time-range-dialog"
            >
              <span class="filter-icon" aria-hidden="true">📅</span>
              <span class="compact-select-label" id="time-range-label">7 days</span>
            </button>
          </div>
        </div>

        <dialog class="picker-dialog" id="program-dialog">
          <form method="dialog" class="picker-dialog-card">
            <p class="picker-dialog-title" id="program-dialog-title">Program</p>
            <div
              class="program-options"
              id="program-options"
              role="listbox"
              aria-labelledby="program-dialog-title"
            ></div>
          </form>
        </dialog>

        <dialog class="picker-dialog" id="time-range-dialog">
          <form method="dialog" class="picker-dialog-card">
            <p class="picker-dialog-title" id="time-range-dialog-title">
              Date range
            </p>
            <div
              class="time-range-presets"
              id="time-range-presets"
              role="listbox"
              aria-labelledby="time-range-dialog-title"
            >
              <button type="button" class="time-range-preset" role="option" data-preset="anytime">
                Anytime
              </button>
              <button type="button" class="time-range-preset" role="option" data-preset="today">
                Today
              </button>
              <button type="button" class="time-range-preset" role="option" data-preset="tomorrow">
                Tomorrow
              </button>
              <button type="button" class="time-range-preset" role="option" data-preset="this_weekend">
                Weekend
              </button>
              <button type="button" class="time-range-preset" role="option" data-preset="next_7_days">
                7 days
              </button>
              <button type="button" class="time-range-preset" role="option" data-preset="custom">
                Custom
              </button>
            </div>
            <div class="time-custom-panel" id="time-custom-panel" hidden>
              <label class="time-custom-field" for="date-from">
                <span>From</span>
                <input id="date-from" class="date-input" type="date" />
              </label>
              <span class="date-sep" aria-hidden="true">–</span>
              <label class="time-custom-field" for="date-to">
                <span>To</span>
                <input id="date-to" class="date-input" type="date" />
              </label>
            </div>
            <button type="submit" class="picker-dialog-done" value="done">Done</button>
          </form>
        </dialog>

        <div
          class="category-chips"
          id="category-chips"
          hidden
          role="radiogroup"
          aria-label="Program category"
        ></div>
      </section>

      <section class="summary-strip" id="summary-strip" hidden></section>

      <section class="mt-4" aria-live="polite">
        <div class="grid gap-2.5" id="results"></div>
      </section>
      </section>

      <section
        class="tab-panel chat-tab-panel"
        id="tab-panel-chat"
        role="tabpanel"
        aria-labelledby="tab-chat"
        data-tab-panel="chat"
        tabindex="0"
        hidden
      >
        <div class="chat-surface" id="chat-root" aria-label="Chat">
          <agent-standard class="chat-agent"></agent-standard>
        </div>
      </section>
    </main>

    <nav class="bottom-tabs" aria-label="Primary">
      <div class="bottom-tabs-inner" role="tablist" aria-label="AOL Guide destinations">
        <button
          type="button"
          class="bottom-tab"
          id="tab-search"
          role="tab"
          aria-selected="true"
          aria-controls="tab-panel-search"
          data-tab="search"
        >
          <svg
            class="bottom-tab-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <span>Search</span>
        </button>
        <button
          type="button"
          class="bottom-tab"
          id="tab-chat"
          role="tab"
          aria-selected="false"
          aria-controls="tab-panel-chat"
          data-tab="chat"
          tabindex="-1"
        >
          <svg
            class="bottom-tab-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            ></path>
          </svg>
          <span>Chat</span>
        </button>
      </div>
    </nav>

    <script type="module" src="/search.ts"></script>
  </body>
</html>
